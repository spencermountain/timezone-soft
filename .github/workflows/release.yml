name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          assert.equal(process.env.RELEASE_TAG.replace(/^v/, ''), version, 'Release tag must match package.json')
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # trusted publishing (OIDC) needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11

      # no token: npm authenticates via the trusted publisher on npmjs.com
      # prepack + prepublishOnly run the build and full check
      - name: Publish
        run: npm publish --access public
