name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run checks
        run: pnpm run check
      - name: Verify committed generated files
        run: |
          changes=$(git status --porcelain --untracked-files=all -- src/generated builds)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- src/generated builds
            echo "::error::Generated files are out of date. Run pnpm run build and commit the results."
            exit 1
          fi
